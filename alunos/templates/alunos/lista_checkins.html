{% extends "alunos/base.html" %}
{% block title %}Frequência{% endblock %}
{% block content %}
<h2 class="mb-4">Check-ins recentes</h2>
<table class="table bg-white">
    <thead><tr><th>Aluno</th><th>Data e hora</th></tr></thead>
    <tbody>
        {% for c in checkins %}
        <tr>
            <td>{{ c.aluno.nome }}</td>
            <td>{{ c.data_hora|date:"d/m/Y H:i" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="2">Nenhum check-in registrado ainda.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
